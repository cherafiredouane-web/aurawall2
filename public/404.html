<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
  <body>
    <script>
      (function () {
        var location = window.location;
        var segments = location.pathname.split('/').filter(Boolean);
        var repository = segments[0] || '';
        var requestedPath = '/' + segments.slice(1).join('/');
        var originalQuery = location.search || '';
        var originalHash = location.hash || '';
        var destination = location.origin + '/' + repository + '/?p=' + encodeURIComponent(requestedPath + originalQuery + originalHash);
        location.replace(destination);
      })();
    </script>
  </body>
</html>
